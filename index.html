<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7785;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #d5dbe3;
      --ok-bg: #e6f6ec;
      --ok-text: #166534;
      --err-bg: #fdecec;
      --err-text: #991b1b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
    }

    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: .95rem;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
      font-size: .9rem;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    input:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: .95rem;
      display: none;
    }

    #message.ok {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-text);
    }

    #message.err {
      display: block;
      background: var(--err-bg);
      color: var(--err-text);
    }

    #lien-liste {
      display: none;
      margin-top: 12px;
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    #lien-liste.visible {
      display: inline-block;
    }

    #lien-liste:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Inscription</h1>
    <p class="sub">Remplissez le formulaire pour vous inscrire.</p>

    <form id="form-inscription" novalidate>
      <label for="nom">Nom</label>
      <input
        type="text"
        id="nom"
        name="nom"
        required
        maxlength="100"
        autocomplete="family-name"
      >

      <label for="prenom">Prénom</label>
      <input
        type="text"
        id="prenom"
        name="prenom"
        required
        maxlength="100"
        autocomplete="given-name"
      >

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        maxlength="150"
        autocomplete="email"
      >

      <label for="telephone">Téléphone</label>
      <input
        type="tel"
        id="telephone"
        name="telephone"
        maxlength="30"
        autocomplete="tel"
      >

      <label for="photo">Photo (JPEG, PNG ou WebP, 5 Mo max)</label>
      <input
        type="file"
        id="photo"
        name="photo"
        accept="image/jpeg,image/png,image/webp"
        required
      >

      <button type="submit" id="btn">S'inscrire</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <a id="lien-liste" href="liste.html">
      Afficher la liste des stagiaires
    </a>
  </main>

  <script>
    const form = document.getElementById('form-inscription');
    const btn = document.getElementById('btn');
    const message = document.getElementById('message');
    const lienListe = document.getElementById('lien-liste');

    function afficher(texte, type) {
      message.textContent = texte;
      message.className = type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      message.className = '';
      message.textContent = '';
      lienListe.classList.remove('visible');

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const fichier = form.photo.files[0];

      if (!fichier) {
        afficher('Veuillez choisir une photo.', 'err');
        return;
      }

      if (!['image/jpeg', 'image/png', 'image/webp'].includes(fichier.type)) {
        afficher('Format non accepté (JPEG, PNG ou WebP uniquement).', 'err');
        return;
      }

      if (fichier.size > 5 * 1024 * 1024) {
        afficher('La photo ne doit pas dépasser 5 Mo.', 'err');
        return;
      }

      const donnees = new FormData(form);

      btn.disabled = true;
      btn.textContent = 'Envoi en cours...';

      try {
        const reponse = await fetch('api/inscrire.php', {
          method: 'POST',
          headers: {
            Accept: 'application/json'
          },
          body: donnees
        });

        let resultat = {};

        try {
          resultat = await reponse.json();
        } catch (_) {}

        if (reponse.ok && resultat.success === true) {
          afficher(
            resultat.message || 'Inscription enregistrée. Merci !',
            'ok'
          );

          form.reset();
          lienListe.classList.add('visible');
        } else {
          afficher(
            resultat.message ||
            resultat.erreur ||
            'Une erreur est survenue (code ' + reponse.status + ').',
            'err'
          );
        }
      } catch (err) {
        afficher(
          'Impossible de joindre le serveur. Réessayez plus tard.',
          'err'
        );
      } finally {
        btn.disabled = false;
        btn.textContent = "S'inscrire";
      }
    });
  </script>
</body>
</html>
